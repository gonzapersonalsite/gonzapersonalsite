name: Render contribution agent

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent.yml
      - .github/scripts/render_agent.py

permissions:
  contents: write

concurrency:
  group: agent
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch render script
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/scripts/render_agent.py" \
            --output "${RUNNER_TEMP}/render_agent.py"

      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "${RUNNER_TEMP}/render_agent.py" "${GITHUB_REPOSITORY_OWNER}" "${RUNNER_TEMP}/dist"

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${RUNNER_TEMP}/dist"
          git init --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --message "Update contribution agent"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
